services:
    postgres:
        image: postgres:17
        container_name: personal-finance-postgres
        environment:
            POSTGRES_DB: personal_finance
            POSTGRES_USER: app_user
            POSTGRES_PASSWORD: app_password
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:
